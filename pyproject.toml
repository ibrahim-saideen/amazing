[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]
